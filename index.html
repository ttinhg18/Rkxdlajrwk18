<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>디노 파크</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<style>
  /* 세로형 모바일 게임. 하나의 가로 맵: [원정 · 도감 · 금고] ← 입구 → [공룡 우리 1~6] */
  :root {
    --ink: #3a2c1c;
    --paper: #fffaf0;
    --soft: #efe5cf;
    --muted: #8b7a62;
    --wood: #9b6634;
    --wood-dark: #6f4521;
    --coin: #ffc93c;
    --coin-dark: #d99a12;
    --gem: #b46cff;
    --grass: #7cc35f;
    --grass-dark: #5fa847;
    --path: #c8c0ae;
    --path-edge: #9d9584;
    --ivory: #f7efdc;
    --bone-line: #6b5a3e;
    --red: #e2533f;
    --teal: #2f8f8a;
    --rare: #3f86d9;
    --legend: #e0a100;
    --outside: #1d3b3a;
    --font: "Jua", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    color-scheme: light;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--outside); color: var(--ink); font-family: var(--font);
    -webkit-user-select: none; user-select: none; overflow: hidden;
  }
  button { font-family: var(--font); cursor: pointer; color: inherit; }
  button:focus-visible, .booth:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }

  #app {
    position: relative; height: 100%; width: min(100vw, 440px); margin: 0 auto;
    overflow: hidden; background: var(--grass); box-shadow: 0 0 40px rgba(0,0,0,.4);
  }

  /* ---------- HUD ---------- */
  .hud {
    position: absolute; z-index: 30; left: 0; right: 0; top: 0;
    display: flex; align-items: center; gap: 8px;
    padding: 10px max(12px, env(safe-area-inset-right, 0px)) 0 max(12px, env(safe-area-inset-left, 0px));
    pointer-events: none;
  }
  .hud > * { pointer-events: auto; }
  .pill {
    display: flex; align-items: center; gap: 5px; height: 36px; padding: 0 12px 0 6px;
    background: rgba(30,40,40,.6); color: #fff; border-radius: 18px; font-size: 18px; border: 0;
    text-shadow: 0 2px 0 rgba(0,0,0,.35); font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  .pill .ic { font-size: 21px; }
  .pill small { font-size: 12px; opacity: .75; }
  .pill.full small { color: #ffb4a8; opacity: 1; }
  .lv {
    width: 50px; height: 50px; border-radius: 50%; padding: 4px; border: 2px solid #fff; flex: none;
    background: conic-gradient(var(--coin) var(--p, 0%), rgba(0,0,0,.4) 0); box-shadow: 0 3px 0 rgba(0,0,0,.25);
  }
  .lv div { width: 100%; height: 100%; border-radius: 50%; background: #4a7fc1; color: #fff; display: grid; place-items: center; align-content: center; line-height: .9; }
  .lv small { font-size: 10px; }
  .lv b { font-weight: 400; font-size: 18px; }
  .hud .spacer { flex: 1; }
  .gear { width: 38px; height: 38px; border: 0; border-radius: 12px; background: rgba(30,40,40,.6); font-size: 20px; flex: none; }
  #coinPill { background: linear-gradient(#5b4318, #3d2c10); }
  #gemPill { background: linear-gradient(#5a2f86, #3b1d5c); }
  .pop { animation: pop .3s; }
  @keyframes pop { 50% { transform: scale(1.12); } }

  /* ---------- 오른쪽 버튼 ---------- */
  .side { position: absolute; z-index: 30; right: max(10px, env(safe-area-inset-right, 0px)); top: 70px; }
  .side button {
    position: relative; width: 60px; height: 60px; border: 0; border-radius: 16px;
    background: #fff; box-shadow: 0 4px 0 #c9bfa8; font-size: 27px; line-height: 1;
    display: grid; place-items: center; padding: 4px 0 0;
  }
  .side button span { font-size: 11px; color: var(--ink); }
  .side button:active { transform: translateY(3px); box-shadow: 0 1px 0 #c9bfa8; }
  .alert {
    position: absolute; top: -8px; right: -8px; width: 24px; height: 24px; border-radius: 50%;
    background: var(--red); color: #fff; font-size: 15px; display: grid; place-items: center; border: 2px solid #fff;
  }

  /* ---------- 가로 맵 ---------- */
  .world {
    position: absolute; inset: 0; display: flex; overflow-x: auto; overflow-y: hidden;
    scroll-snap-type: x mandatory; scrollbar-width: none; overscroll-behavior-x: contain;
  }
  .world::-webkit-scrollbar { display: none; }
  .panel { position: relative; flex: 0 0 100%; height: 100%; scroll-snap-align: start; overflow: hidden; }

  .nav {
    position: absolute; z-index: 25; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); left: 0; right: 0;
    display: flex; justify-content: center; gap: 4px; pointer-events: none;
  }
  .nav button {
    pointer-events: auto; width: 29px; height: 29px; border-radius: 50%; border: 2px solid #fff;
    background: rgba(30,40,40,.5); color: #fff; font-size: 13px; padding: 0; position: relative; flex: none;
  }
  .nav button.on { background: var(--coin); transform: scale(1.14); }
  .nav .sep { width: 6px; }
  .nav button .dot-alert {
    position: absolute; top: -5px; right: -5px; width: 12px; height: 12px; border-radius: 50%;
    background: var(--red); border: 2px solid #fff;
  }
  .arrow {
    position: absolute; z-index: 24; top: 50%; width: 32px; height: 54px; border: 0;
    background: rgba(30,40,40,.35); color: #fff; font-size: 22px; translate: 0 -50%;
  }
  .arrow.l { left: 0; border-radius: 0 14px 14px 0; }
  .arrow.r { right: 0; border-radius: 14px 0 0 14px; }

  /* ---------- 공통 패널 레이아웃 ---------- */
  .sheet {
    display: flex; flex-direction: column; gap: 10px;
    padding: 70px 14px calc(56px + env(safe-area-inset-bottom, 0px));
    overflow-y: auto; scrollbar-width: none;
  }
  .sheet::-webkit-scrollbar { display: none; }
  .sign {
    align-self: center; text-align: center; background: linear-gradient(var(--wood), var(--wood-dark));
    border: 3px solid #4d2f14; border-radius: 12px; color: #fff3cf; padding: 6px 18px 5px; min-width: 58%;
    box-shadow: 0 4px 0 rgba(0,0,0,.2); flex: none;
  }
  .sign b { display: block; font-size: 24px; font-weight: 400; }
  .sign small { font-size: 12px; opacity: .85; }
  .card { background: var(--paper); border-radius: 18px; padding: 12px; box-shadow: 0 5px 0 rgba(0,0,0,.18); flex: none; }
  .card h3 { margin: 0 0 8px; font-weight: 400; font-size: 17px; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .card h3 small { font-size: 13px; color: var(--muted); }
  .big-btn {
    display: block; width: 100%; margin-top: 10px; border: 0; border-radius: 14px; padding: 11px;
    font-size: 18px; color: #fff; background: #e98a2c; box-shadow: 0 4px 0 #b4621a;
  }
  .big-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #b4621a; }
  .big-btn:disabled { background: #c9bfae; box-shadow: 0 4px 0 #a39a89; cursor: default; transform: none; }
  .big-btn.green { background: #4caf50; box-shadow: 0 4px 0 #2f7d32; }
  .big-btn.purple { background: #8e4fd6; box-shadow: 0 4px 0 #5e2d9a; }
  .big-btn.ghost-btn { background: transparent; color: var(--muted); box-shadow: none; border: 2px solid #e2d6bd; }
  .muted { color: var(--muted); font-size: 13px; text-align: center; margin-top: 6px; }
  .bar { height: 12px; border-radius: 6px; background: #e2d6bd; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--coin); border-radius: 6px; transition: width .4s; }

  /* ---------- 입구 ---------- */
  .entrance { background:
      radial-gradient(circle at 15% 70%, rgba(255,255,255,.08) 0 40px, transparent 41px),
      radial-gradient(circle at 85% 40%, rgba(255,255,255,.08) 0 50px, transparent 51px),
      var(--grass); }
  .path-v {
    position: absolute; left: 24%; right: 24%; top: 0; bottom: 10%;
    background: var(--path); border-left: 8px solid var(--path-edge); border-right: 8px solid var(--path-edge);
    background-image: repeating-linear-gradient(0deg, transparent 0 46px, rgba(0,0,0,.05) 46px 48px);
  }
  .path-h {
    position: absolute; left: 0; right: 0; bottom: 10%; height: 13%;
    background: var(--path); border-top: 8px solid var(--path-edge); border-bottom: 8px solid var(--path-edge);
  }
  .path-h::before { content: ""; position: absolute; left: 24%; right: 24%; top: -8px; height: 8px; background: var(--path); }
  .hedge {
    position: absolute; left: 0; right: 0; bottom: 0; height: 10%;
    background:
      radial-gradient(circle at 12px 14px, #4f9a3a 0 14px, transparent 15px) 0 0 / 28px 28px repeat-x,
      radial-gradient(circle at 6px 22px, #64b24b 0 12px, transparent 13px) 0 0 / 28px 28px repeat-x,
      #4a8f36;
  }
  .tree { position: absolute; width: 74px; height: 84px; translate: -50% -100%; pointer-events: none; }
  .tree::after { content: ""; position: absolute; left: 50%; bottom: 0; width: 16px; height: 22px; translate: -50% 0; background: #8a5a2e; border-radius: 0 0 6px 6px; }
  .tree::before {
    content: ""; position: absolute; left: 0; right: 0; top: 0; height: 66px; z-index: 1; border-radius: 46% 54% 48% 52%;
    background: radial-gradient(circle at 30% 30%, #9fdc78 0 14px, transparent 15px), radial-gradient(circle at 70% 45%, #74bf55 0 18px, transparent 19px), #5fae44;
    box-shadow: 0 8px 0 #3f8a32, 6px 14px 16px rgba(0,0,0,.18);
  }
  .tree.s { transform: scale(.78); transform-origin: 50% 100%; }

  .gate { position: absolute; left: 50%; top: calc(46px + 3%); width: 82%; height: 26%; translate: -50% 0; z-index: 6; pointer-events: none; }
  .gate .pillar { position: absolute; bottom: 0; width: 34px; height: 76%; background: var(--ivory); border: 4px solid var(--bone-line); border-radius: 14px; }
  .gate .pillar::before, .gate .pillar::after {
    content: ""; position: absolute; left: 50%; translate: -50% 0; width: 56px; height: 30px;
    background: var(--ivory); border: 4px solid var(--bone-line); border-radius: 15px;
  }
  .gate .pillar::before { top: -18px; }
  .gate .pillar::after { bottom: -12px; }
  .gate .pillar.l { left: 12%; }
  .gate .pillar.r { right: 12%; }
  .gate .board {
    position: absolute; left: 50%; top: 10%; translate: -50% 0; width: 92%; padding: 10px 0 8px;
    background: linear-gradient(var(--wood), var(--wood-dark)); border: 4px solid #4d2f14; border-radius: 16px;
    text-align: center; color: #ffe9a8; font-size: clamp(30px, 9vw, 40px); letter-spacing: 2px;
    text-shadow: 0 3px 0 #4d2f14; box-shadow: 0 6px 0 rgba(0,0,0,.2);
  }
  .gate .board small { display: block; font-size: 13px; color: #f6d690; letter-spacing: 4px; text-shadow: none; margin-top: -2px; }
  .gate .skull { position: absolute; left: 50%; top: -14%; translate: -50% 0; width: 64px; z-index: 2; }

  .booth { position: absolute; left: 50%; top: 47%; width: 132px; translate: -50% -50%; z-index: 5; cursor: pointer; outline: none; }
  .booth .base {
    position: absolute; left: 50%; bottom: -16px; width: 190px; height: 64px; translate: -50% 0; z-index: -1;
    border-radius: 50%; background: var(--grass-dark); border: 6px solid var(--path-edge);
  }
  .booth .awning { height: 30px; border-radius: 12px 12px 4px 4px; border: 3px solid #7c2a1c; background: repeating-linear-gradient(90deg, var(--red) 0 18px, #fff3e0 18px 36px); }
  .booth .body {
    margin: 0 8px; height: 84px; background: var(--teal); border: 3px solid #1d5b58; border-top: 0;
    border-radius: 0 0 10px 10px; padding: 8px; display: flex; flex-direction: column; gap: 6px;
  }
  .booth .window { flex: 1; background: #fbe9c9; border: 3px solid #1d5b58; border-radius: 8px; display: grid; place-items: center; font-size: 30px; line-height: 1; overflow: hidden; }
  .booth .label { text-align: center; color: #fff; font-size: 14px; }
  .bubble {
    position: absolute; left: 50%; bottom: calc(100% + 12px); translate: -50% 0; z-index: 2;
    background: #fff; border: 3px solid var(--ink); border-radius: 18px; padding: 4px 12px;
    font-size: 20px; white-space: nowrap; display: flex; align-items: center; gap: 4px;
    font-variant-numeric: tabular-nums; box-shadow: 0 4px 0 rgba(0,0,0,.2);
  }
  .bubble::after { content: ""; position: absolute; left: 50%; top: 100%; translate: -50% -3px; border: 10px solid transparent; border-top-color: var(--ink); }
  .bubble.full { background: var(--coin); animation: nudge 1s infinite; }
  @keyframes nudge { 50% { translate: -50% -6px; } }
  .booth:active .body { filter: brightness(1.1); }
  .tap-hint { position: absolute; left: 50%; top: calc(100% + 26px); translate: -50% 0; font-size: 14px; color: #fff; white-space: nowrap; text-shadow: 0 2px 0 rgba(0,0,0,.35); }

  .visitor { position: absolute; z-index: 4; width: 22px; height: 34px; translate: -50% -100%; pointer-events: none; }
  .visitor .h { width: 22px; height: 20px; border-radius: 8px; background: #f2c9a0; border: 2px solid var(--ink); position: relative; }
  .visitor .h::before { content: ""; position: absolute; left: -2px; right: -2px; top: -4px; height: 9px; border-radius: 8px 8px 2px 2px; background: var(--hair); border: 2px solid var(--ink); border-bottom: 0; }
  .visitor .h::after { content: ""; position: absolute; left: 5px; top: 9px; width: 8px; height: 3px; border-left: 3px solid var(--ink); border-right: 3px solid var(--ink); }
  .visitor .b { width: 18px; height: 14px; margin: -1px auto 0; border-radius: 4px 4px 3px 3px; background: var(--shirt); border: 2px solid var(--ink); }
  .visitor.walk { animation: bob .35s infinite alternate; }
  @keyframes bob { to { margin-top: -3px; } }

  .hint-row {
    position: absolute; z-index: 7; left: 14px; right: 14px; bottom: calc(17% + 6px);
    display: flex; justify-content: space-between; color: #fff; font-size: 14px; text-shadow: 0 2px 0 rgba(0,0,0,.4);
  }
  .hint-row span:first-child { animation: hintL 1.6s infinite; }
  .hint-row span:last-child { animation: hintR 1.6s infinite; }
  @keyframes hintL { 50% { translate: -6px 0; } }
  @keyframes hintR { 50% { translate: 6px 0; } }

  /* ---------- 공룡 우리 ---------- */
  .pen { display: flex; flex-direction: column; gap: 10px; padding: 64px 14px calc(56px + env(safe-area-inset-bottom, 0px)); }
  .pen.grass { background: #79c25f; }
  .pen.snow { background: #b9dcef; }
  .pen.volcano { background: #5a4038; }
  .habitat {
    position: relative; flex: 1; min-height: 160px; border-radius: 18px; overflow: hidden;
    border: 8px solid #8b5a2b; box-shadow: inset 0 0 0 3px #b8854c, 0 6px 0 rgba(0,0,0,.18);
  }
  .grass .habitat { background: radial-gradient(circle at 30% 70%, #a6de82 0 50px, transparent 51px), radial-gradient(circle at 75% 30%, #a6de82 0 36px, transparent 37px), #92d070; }
  .snow .habitat { background: radial-gradient(ellipse at 25% 80%, #fff 0 60px, transparent 61px), radial-gradient(ellipse at 80% 35%, #fff 0 44px, transparent 45px), #e3f1f9; }
  .volcano .habitat { background: radial-gradient(ellipse at 70% 78%, #ff9b3d 0 34px, #e2533f 35px 44px, transparent 45px), #7a5446; }
  .habitat .fence {
    position: absolute; left: 0; right: 0; bottom: 0; height: 26px; z-index: 3; pointer-events: none;
    background: linear-gradient(transparent 6px, #a8713c 6px 11px, transparent 11px 16px, #a8713c 16px 21px, transparent 21px),
                repeating-linear-gradient(90deg, transparent 0 28px, #8b5a2b 28px 36px);
  }
  .deco { position: absolute; font-size: 30px; pointer-events: none; translate: -50% -100%; }
  .dino { position: absolute; translate: -50% -100%; z-index: 2; cursor: pointer; line-height: 1; text-align: center; transition: left 2.2s ease-in-out, top 2.2s ease-in-out; }
  .dino .sprite { display: inline-block; transition: transform .3s; }
  .dino .sprite.flip { transform: scaleX(-1); }
  .dino.hop .sprite { animation: hop .45s; }
  @keyframes hop { 40% { translate: 0 -22px; } }
  .dino .shadow { width: 70%; height: 10px; margin: -4px auto 0; border-radius: 50%; background: rgba(0,0,0,.18); }
  .ghost { position: absolute; left: 50%; top: 52%; translate: -50% -50%; text-align: center; line-height: 1; }
  .ghost .q { position: absolute; left: 50%; top: 50%; translate: -50% -50%; font-size: 46px; color: #fff; text-shadow: 0 3px 0 rgba(0,0,0,.3); }
  .parts { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .part { border-radius: 12px; background: var(--soft); padding: 4px 2px 5px; text-align: center; font-size: 12px; line-height: 1.15; border: 2px solid transparent; min-width: 0; }
  .part svg { width: 34px; height: 34px; display: block; margin: 0 auto 1px; }
  .part.none svg { filter: grayscale(1) opacity(.35); }
  .part.done { background: #d9f0c6; border-color: #7cc35f; }
  .part.ready { border-color: var(--coin-dark); background: #fff1c4; }
  .part .n { font-size: 13px; font-variant-numeric: tabular-nums; }
  .part .have { color: var(--coin-dark); font-size: 11px; }
  .owned-info { display: flex; gap: 10px; }
  .stat { flex: 1; text-align: center; background: var(--soft); border-radius: 12px; padding: 8px 4px; }
  .stat b { display: block; font-size: 20px; font-weight: 400; font-variant-numeric: tabular-nums; }
  .stat small { color: var(--muted); font-size: 12px; }

  /* ---------- 금고 ---------- */
  .vault-room { background: repeating-linear-gradient(90deg, #6e655c 0 2px, transparent 2px 60px), repeating-linear-gradient(0deg, #6e655c 0 2px, #857a6e 2px 40px); }
  .safe {
    width: 150px; height: 150px; margin: 4px auto 10px; border-radius: 20px; position: relative;
    background: var(--safe); border: 7px solid var(--safe-dark);
    box-shadow: inset 0 0 0 7px rgba(255,255,255,.18), 0 8px 0 rgba(0,0,0,.25);
  }
  .safe .dial { position: absolute; left: 44%; top: 50%; width: 60px; height: 60px; translate: -50% -50%; border-radius: 50%; border: 5px solid var(--safe-dark); background: radial-gradient(circle, #eee 0 9px, #8d8d8d 10px 13px, #cfcfcf 14px); }
  .safe .handle { position: absolute; right: 14px; top: 50%; width: 11px; height: 50px; translate: 0 -50%; border-radius: 6px; background: var(--safe-dark); }
  .safe .feet::before, .safe .feet::after { content: ""; position: absolute; bottom: -18px; width: 26px; height: 12px; border-radius: 0 0 6px 6px; background: var(--safe-dark); }
  .safe .feet::before { left: 14px; } .safe .feet::after { right: 14px; }
  .tiers { display: flex; flex-direction: column; gap: 6px; }
  .tier { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 12px; background: var(--soft); font-size: 14px; }
  .tier .sw { width: 22px; height: 22px; border-radius: 6px; background: var(--safe); border: 3px solid var(--safe-dark); flex: none; }
  .tier .nm { flex: 1; }
  .tier .req { color: var(--muted); font-size: 12px; text-align: right; }
  .tier.cur { background: #fff1c4; outline: 2px solid var(--coin-dark); }
  .tier.done { opacity: .55; }

  /* ---------- 도감 ---------- */
  .library { background: repeating-linear-gradient(0deg, #b98a5a 0 6px, #c99a68 6px 52px); }
  .codex { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .relic { background: var(--soft); border-radius: 14px; padding: 8px 4px; text-align: center; min-width: 0; border: 2px solid transparent; position: relative; }
  .relic .em { font-size: 34px; line-height: 1.1; height: 40px; display: grid; place-items: center; }
  .relic .nm { font-size: 13px; }
  .relic .meta { font-size: 11px; color: var(--muted); }
  .relic.unknown .em { filter: brightness(0) opacity(.25); }
  .relic.rare { border-color: var(--rare); }
  .relic.legend { border-color: var(--legend); background: #fff4cf; }
  .tag { display: inline-block; font-size: 10px; color: #fff; border-radius: 6px; padding: 1px 5px; margin-top: 2px; }
  .tag.rare { background: var(--rare); } .tag.legend { background: var(--legend); }
  .relic .cnt { position: absolute; top: 4px; right: 6px; font-size: 11px; color: var(--muted); }
  .miles { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .mile { border: 0; border-radius: 12px; background: var(--soft); padding: 6px 2px; font-size: 12px; line-height: 1.25; text-align: center; }
  .mile b { display: block; font-weight: 400; font-size: 15px; }
  .mile.ready { background: var(--gem); color: #fff; animation: nudge2 1s infinite; }
  .mile.claimed { opacity: .5; }
  @keyframes nudge2 { 50% { transform: translateY(-3px); } }

  /* ---------- 원정 ---------- */
  .harbor { background: radial-gradient(ellipse at 30% 20%, rgba(255,255,255,.18) 0 30px, transparent 31px) 0 0 / 120px 70px, #4fa3c7; }
  .staff { display: flex; gap: 10px; align-items: center; }
  .staff .face { width: 54px; height: 54px; border-radius: 50%; background: var(--soft); display: grid; place-items: center; font-size: 32px; flex: none; }
  .staff .who { flex: 1; min-width: 0; }
  .staff .who b { font-weight: 400; font-size: 17px; display: block; }
  .staff .who small { color: var(--muted); font-size: 13px; }
  .trips { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 10px; }
  .trip { border: 0; border-radius: 12px; background: var(--soft); padding: 7px 2px; font-size: 12px; line-height: 1.3; text-align: center; box-shadow: 0 3px 0 #d6c8a8; }

           inv: {}, placed: {}, owned: {}, relics: {}, claimed: [], staff: STAFF.map(() => null) };

  const add = Math.max(0, Math.min(Math.floor(n), vaultCap() - S.coins));

  if (add < Math.floor(n) && !silent) toast('금고가 꽉 찼어요! 금고를 업그레이드하세요.');
  renderHud();
  return add;
}
function gainGems(n) { S.gems += n; renderHud(); bump('gemPill'); }
const xpNeed = L => Math.round(60 * Math.pow(L, 1.6));
const levelUps = [];
function addXp(n) {
  S.xp += n;
  while (S.xp >= xpNeed(S.level)) {
    S.xp -= xpNeed(S.level); S.level++;
    const g = 3 + S.level; S.gems += g;
    levelUps.push({ level: S.level, gems: g });
  }
  renderHud();
  if (levelUps.length && !document.querySelector('.modal.lvup')) showLevelUp();
}
function showLevelUp() {
  const ups = levelUps.splice(0), last = ups[ups.length - 1], g = ups.reduce((s, u) => s + u.gems, 0);

  VAULTS.forEach((v, i) => { if (ups.some(u => u.level === v.level) && i > S.vault) unlocks.push(`🏦 ${v.name} 업그레이드 가능`); });

function placeBones(k) {

    if (move > 0) { S.placed[k][part] = placedOf(k, part) + move; S.inv[key] -= move; n += move; }
  }
  toast(isComplete(k) ? `뼈가 다 모였어요! ${sp.name}를 되살려보세요.` : `뼈 ${n}개를 배치했어요.`);

           <button class="big-btn ghost-btn" data-skip="${i}" ${S.gems >= skip ? '' : 'disabled'}>💎 ${skip}로 바로 끝내기</button>`}

function fmtTime(ms) {
  const s = Math.max(0, Math.ceil(ms / 1000)), h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), sec = s % 60;
  return h ? `${h}시간 ${String(m).padStart(2, '0')}분` : `${m}분 ${String(sec).padStart(2, '0')}초`;
}
function startTrip(i, tid) {
  const t = TRIPS[tid];
  if (S.gems < t.gems || S.level < t.level || S.staff[i]) return;
  S.gems -= t.gems;
  S.staff[i] = { trip: tid, start: Date.now(), end: Date.now() + t.hours * 3600000 };
  toast(`${STAFF[i].name}가 ${t.name}을 떠났어요! ${t.hours}시간 뒤에 돌아와요.`);
  renderAll(); save();
}
function skipTrip(i) {
  const job = S.staff[i]; if (!job) return;
  const skip = Math.max(1, Math.ceil((job.end - Date.now()) / 3600000) * 3);
  if (S.gems < skip) return;
  S.gems -= skip; job.end = Date.now();
  renderAll(); save();
}
function claimTrip(i) {
  const job = S.staff[i]; if (!job || job.end > Date.now()) return;
  const t = TRIPS[job.trip];
  S.staff[i] = null;
  const coin = gainCoins(rand(...t.coin), true);
  const items = [];
  for (let b = 0; b < t.bones; b++) {
    const { k, part } = rollBone(t.mine);
    if (S.owned[k]) { gainCoins(MINES[t.mine].dupe, true); continue; }
    S.inv[k + '.' + part] = (S.inv[k + '.' + part] || 0) + 1;
    items.push(`<div>${boneSVG(part)}${SPECIES[k].name}<br>${PARTS[part]}</div>`);
  }
  let relicHtml = '';
  if (Math.random() < t.relic) {
    const id = rollRelic(t.mine), first = gainRelic(id);
    relicHtml = `<div style="border:2px solid var(--${RELICS[id].rar === 'legend' ? 'legend' : 'rare'})"><span class="em">${RELICS[id].em}</span>${RELICS[id].name}${first ? '<br>NEW!' : ''}</div>`;
  }
  addXp(t.xp);
  modal(`<div class="big-em">${STAFF[i].face}</div><h3>${t.name} 귀환!</h3>
    <div class="found">${relicHtml}${items.join('')}</div>
    <p class="muted">코인 +${fmt(coin)}${coin < t.coin[0] ? ' (금고가 꽉 차서 일부만)' : ''}</p>
    <button class="big-btn green" data-close>받기</button>`);
  renderAll(); save();
}
function tickExpedition() {
  const now = Date.now();
  let changed = false;
  S.staff.forEach((job, i) => {
    if (!job) return;
    const left = job.end - now, el = document.querySelector(`[data-left="${i}"]`), bar = document.querySelector(`[data-bar="${i}"]`);
    if (left <= 0 && el) changed = true;
    if (el) el.textContent = fmtTime(left);
    if (bar) bar.style.width = (1 - left / (job.end - job.start)) * 100 + '%';
  });
  if (changed) { renderExpedition(); renderNav(); }
}
const tripReady = () => S.staff.some(j => j && j.end <= Date.now());

/* ================= 광산 ================= */
let dig = null;
function openMine() { $('mine').hidden = false; renderMineSelect(); }
function closeMine() { $('mine').hidden = true; dig = null; renderAll(); }
function renderMineSelect() {
  const m = $('mine');
  m.innerHTML = `
    <div class="ov-head"><h2>⛏️ 광산 고르기</h2><span class="wallet">🪙 ${fmt(S.coins)}</span><button class="close" id="mClose">공원으로</button></div>
    <div class="mine-list">${Object.entries(MINES).map(([id, mi]) => {
      const who = ORDER.filter(k => SPECIES[k].mine === id);
      const tooBig = mi.cost > vaultCap(), poor = S.coins < mi.cost;
      return `<button class="mine-card ${id}" data-id="${id}" ${poor ? 'disabled' : ''}>
        <div class="t">${mi.name}<span class="cost">🪙 ${fmt(mi.cost)}</span></div>
        <div class="who">${who.map(k => `<span>${S.owned[k] ? '✅' : '🦴'} ${SPECIES[k].name}</span>`).join('')}</div>
        <div style="font-size:13px">곡괭이 ${DIG_ENERGY}번 · ${tooBig ? '금고를 업그레이드해야 입장료를 모을 수 있어요' : poor ? '코인이 부족해요' : '눌러서 입장'}</div>
      </button>`;
    }).join('')}</div>`;
  $('mClose').onclick = closeMine;
  m.querySelectorAll('.mine-card').forEach(b => b.onclick = () => enterMine(b.dataset.id));
}
function rollBone(mineId) {
  const all = ORDER.filter(k => SPECIES[k].mine === mineId);
  const open = all.filter(k => !S.owned[k]);
  const k = pick(open.length ? open : all);
  const entries = Object.entries(SPECIES[k].parts).map(([part, need]) => [part, Math.max(0.4, need - placedOf(k, part) - invOf(k, part)) + need * 0.3]);
  let r = Math.random() * entries.reduce((s, e) => s + e[1], 0);
  for (const [part, w] of entries) { if ((r -= w) <= 0) return { k, part }; }
  return { k, part: entries[0][0] };
}
function enterMine(id) {
  const mi = MINES[id];
  if (S.coins < mi.cost) return toast('코인이 부족해요. 매표소에서 입장료를 받아오세요!');
  S.coins -= mi.cost; renderHud();
  const tiles = Array.from({ length: 30 }, () => ({ kind: 'empty' }));
  const idx = tiles.map((_, i) => i).sort(() => Math.random() - 0.5);
  idx.slice(0, 12).forEach(i => Object.assign(tiles[i], { kind: 'bone', ...rollBone(id) }));
  idx.slice(12, 17).forEach(i => Object.assign(tiles[i], { kind: 'coin', amt: Math.round(rand(...mi.coin)) }));
  dig = { id, tiles, energy: DIG_ENERGY, found: [], relics: [], coins: 0, done: false };
  renderDig(); save();
}
function renderDig() {
  const mi = MINES[dig.id], m = $('mine');
  m.style.setProperty('--soil', mi.soil); m.style.setProperty('--hole', mi.hole);
  m.innerHTML = `
    <div class="ov-head"><h2>${mi.name}</h2><button class="close" id="mExit">그만 파기</button></div>
    <div class="energy" id="energy"></div>
    <div class="grid">${dig.tiles.map((t, i) => `<button class="tile" data-i="${i}" aria-label="땅 파기"></button>`).join('')}</div>
    <div class="tray"><div class="lbl">이번에 찾은 것</div><div class="items" id="tray"><span class="empty">곡괭이는 ${DIG_ENERGY}번! 어디를 팔지 잘 골라보세요.</span></div></div>`;
  $('mExit').onclick = finishDig;
  m.querySelectorAll('.tile').forEach(b => b.onclick = () => digTile(+b.dataset.i, b));
  renderEnergy();
}
function renderEnergy() {
  $('energy').innerHTML = `<span>곡괭이</span>` + Array.from({ length: DIG_ENERGY }, (_, i) => `<i class="${i >= dig.energy ? 'used' : ''}">⛏️</i>`).join('');
}
function digTile(i, el) {
  const t = dig.tiles[i];
  if (dig.done || t.dug || dig.energy <= 0) return;
  dig.energy--; t.dug = true;
  el.classList.add('dug', 'shake');
  const r = relPos(el), roll = Math.random();
  let xp = 3;
  if (roll < LEGEND_CHANCE || roll < LEGEND_CHANCE + RARE_CHANCE) { // 아주 희귀한 유물!
    const id = roll < LEGEND_CHANCE ? rollRelic(null, 1 / 0.12) : rollRelic(dig.id, 0);
    const first = gainRelic(id);
    el.classList.add('treasure'); el.innerHTML = `<div class="t-em">${RELICS[id].em}</div>`;
    dig.relics.push(id);
    modal(`<div class="big-em">${RELICS[id].em}</div><h3>${RELICS[id].rar === 'legend' ? '전설' : '희귀'} 유물 발견!</h3>
      <p style="font-size:20px;margin:4px 0">${RELICS[id].name}</p>
      <p class="muted">${first ? '📖 도감에 새로 등록됐어요!' : '이미 도감에 있는 유물이에요.'}</p>
      <button class="big-btn purple" data-close>계속 파기</button>`);
  } else if (t.kind === 'bone') {
    const sp = SPECIES[t.k];
    el.innerHTML = boneSVG(t.part);
    if (S.owned[t.k]) {
      const got = gainCoins(MINES[dig.id].dupe); dig.coins += got;
      floatAt(r.x, r.y - 20, `이미 복원한 공룡 뼈 → +${got}🪙`);
    } else {
      const key = t.k + '.' + t.part; S.inv[key] = (S.inv[key] || 0) + 1;
      floatAt(r.x, r.y - 20, `${sp.name} ${PARTS[t.part]}!`);
      xp += 5;
    }
    dig.found.push(t);
  } else if (t.kind === 'coin') {
    const got = gainCoins(t.amt); dig.coins += got;
    el.innerHTML = `<div class="c">🪙<br>+${t.amt}</div>`;
    floatAt(r.x, r.y - 20, `+${got} 🪙`);
  }
  renderEnergy(); renderTray(); addXp(xp); save();
  if (dig.energy <= 0) { dig.done = true; setTimeout(finishDig, 800); }
}
function renderTray() {
  const html = dig.relics.map(id => `<span style="font-size:26px">${RELICS[id].em}</span>`).join('')
    + dig.found.map(t => `<span title="${SPECIES[t.k].name} ${PARTS[t.part]}">${boneSVG(t.part)}</span>`).join('')
    + (dig.coins ? `<span style="margin-left:6px">🪙 +${dig.coins}</span>` : '');
  $('tray').innerHTML = html || '<span class="empty">아무것도 안 나왔어요.</span>';
}
function finishDig() {
  if (!dig || document.querySelector('.modal.dig-result')) return;
  if (document.querySelector('.modal:not(.dig-result)')) { setTimeout(finishDig, 400); return; }
  dig.done = true;
  const mi = MINES[dig.id], id = dig.id;
  const list = dig.relics.map(r => `<div><span class="em">${RELICS[r].em}</span>${RELICS[r].name}</div>`).join('')
    + dig.found.map(t => `<div>${boneSVG(t.part)}${SPECIES[t.k].name}<br>${PARTS[t.part]}</div>`).join('');
  const m = modal(`<h3>발굴 끝!</h3>
    <div class="found">${list || '<p class="muted">이번엔 뼈를 못 찾았어요.</p>'}</div>
    ${dig.coins ? `<p class="muted">코인 +${fmt(dig.coins)}</p>` : ''}
    <button class="big-btn green" id="rHome">공원으로 가서 뼈 맞추기</button>
    <button class="big-btn" id="rAgain" ${S.coins < mi.cost ? 'disabled' : ''}>한 번 더 파기 (🪙 ${fmt(mi.cost)})</button>
    <button class="big-btn ghost-btn" id="rList">다른 광산 보기</button>`, 'dig-result');
  $('rHome').onclick = () => {
    m.remove();
    const target = ORDER.find(k => canPlace(k) || (!S.owned[k] && isComplete(k)));
    closeMine();
    if (target) goTo(ENTRANCE + 1 + ORDER.indexOf(target));
  };
  $('rAgain').onclick = () => { m.remove(); enterMine(id); };
  $('rList').onclick = () => { m.remove(); dig = null; renderMineSelect(); };
}

/* ================= 화면 이동 ================= */
const PANELS = () => world.children.length;
const current = () => Math.round(world.scrollLeft / world.clientWidth);
function goTo(i, smooth = true) {
  i = Math.max(0, Math.min(PANELS() - 1, i));
  world.scrollTo({ left: i * world.clientWidth, behavior: smooth ? 'smooth' : 'auto' });
}
function buildNav() {
  const labels = ['🧭', '📖', '🏦', '🎪', ...ORDER.map((_, i) => i + 1)];
  const names = ['원정', '도감', '금고', '입구', ...ORDER.map((_, i) => `${i + 1}번 우리`)];
  $('nav').innerHTML = labels.map((t, i) => `${i === ENTRANCE ? '<span class="sep"></span>' : ''}<button data-i="${i}" aria-label="${names[i]}">${t}</button>${i === ENTRANCE ? '<span class="sep"></span>' : ''}`).join('');
  $('nav').querySelectorAll('button').forEach(b => b.onclick = () => goTo(+b.dataset.i));
}
function renderNav() {
  const c = current();
  $('nav').querySelectorAll('button').forEach(b => {
    const i = +b.dataset.i;
    b.classList.toggle('on', i === c);
    let alert = false;
    if (i === 0) alert = tripReady();
    else if (i === 1) alert = mileReady();
    else if (i === 2) alert = vaultReady();
    else if (i > ENTRANCE) { const k = ORDER[i - ENTRANCE - 1]; alert = canPlace(k) || (!S.owned[k] && isComplete(k)); }
    let dot = b.querySelector('.dot-alert');
    if (alert && !dot) { dot = document.createElement('span'); dot.className = 'dot-alert'; b.appendChild(dot); }
    if (!alert && dot) dot.remove();
  });
  $('prevBtn').hidden = c === 0;
  $('nextBtn').hidden = c === PANELS() - 1;
}

/* ================= 렌더 ================= */
function renderHud() {
  $('coins').textContent = fmt(S.coins);
  $('coinCap').textContent = '/' + fmt(vaultCap());
  $('coinPill').classList.toggle('full', S.coins >= vaultCap());
  $('gems').textContent = fmt(S.gems);
  $('lvNum').textContent = S.level;

  if (S.coins < cheapest && a) a.remove();
}
function renderAll() { renderHud(); renderBooth(); ORDER.forEach(renderPen); renderVault(); renderCodex(); renderExpedition(); renderNav(); }

function buildWorld() {
  world.innerHTML = ''; walkers = 0;
  buildSheet('expedition', 'harbor', '직원을 보내 보물을 찾아요', '🧭 원정 선착장');
  buildSheet('codex', 'library', '발굴한 희귀 유물 모음', '📖 유물 도감');

/* ================= 시작 ================= */
buildWorld();
buildNav();
const away = Math.min(8 * 3600, Math.max(0, (Date.now() - (S.last || Date.now())) / 1000));
const before = S.booth;
S.booth = Math.min(boothCap(), S.booth + away * rate());
renderAll();
requestAnimationFrame(() => { goTo(ENTRANCE, false); renderNav(); });
if (S.booth - before >= 10 && away > 60) toast(`자리를 비운 동안 매표소에 🪙 ${fmt(S.booth - before)} 모였어요!`);
else if (!ORDER.some(k => S.owned[k]) && !Object.keys(S.inv).length) toast('매표소를 눌러 입장료를 받고, 광산에서 뼈를 찾아보세요!');

world.addEventListener('scroll', () => { clearTimeout(world._t); world._t = setTimeout(renderNav, 60); });
let lastIdx = ENTRANCE;
window.addEventListener('resize', () => goTo(lastIdx, false));
world.addEventListener('scrollend', () => { lastIdx = current(); });
$('prevBtn').onclick = () => goTo(current() - 1);
$('nextBtn').onclick = () => goTo(current() + 1);
$('mineBtn').onclick = openMine;
$('lvBadge').onclick = () => toast(`Lv ${S.level} · 경험치 ${fmt(S.xp)} / ${fmt(xpNeed(S.level))}`);
/* ================= 저장 코드 ================= */
// 진행 상황을 숫자 배열로 압축 → 36진수 → 0이 이어지면 줄여 쓰기 → 끝에 오타 확인용 체크섬
const PART_KEYS = ORDER.flatMap(k => Object.keys(SPECIES[k].parts).map(p => [k, p]));
const RELIC_KEYS = Object.keys(RELICS), TRIP_KEYS = Object.keys(TRIPS);
function checksum(str) {
  let h = 7;
  for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) % 1679616; // 36^4
  return h.toString(36).padStart(4, '0');
}
function makeCode() {
  const nums = [
    Math.floor(S.coins), S.gems, S.level, Math.floor(S.xp), S.vault, Math.floor(S.booth), Math.floor(Date.now() / 1000),
    ORDER.reduce((m, k, i) => m | (S.owned[k] ? 1 << i : 0), 0),
    S.claimed.reduce((m, i) => m | (1 << i), 0),
    ...PART_KEYS.map(([k, p]) => invOf(k, p)),
    ...PART_KEYS.map(([k, p]) => placedOf(k, p)),
    ...RELIC_KEYS.map(id => S.relics[id] || 0),
    ...S.staff.flatMap(j => j ? [TRIP_KEYS.indexOf(j.trip) + 1, Math.ceil(j.end / 1000)] : [0, 0]),
  ];
  const tokens = [];
  for (let i = 0; i < nums.length; i++) {
    if (nums[i] === 0) {
      let run = 1; while (nums[i + run] === 0) run++;
      tokens.push(run > 1 ? '_' + run.toString(36) : '0'); i += run - 1;
    } else tokens.push(Math.max(0, nums[i]).toString(36));
  }
  const body = tokens.join('.');
  return `DP1-${body}-${checksum(body)}`;
}
function readCode(code) {
  const m = code.trim().toLowerCase().replace(/\s+/g, '').match(/^dp1-([0-9a-z._]+)-([0-9a-z]{4})$/);
  if (!m) throw '코드 모양이 맞지 않아요. DP1-로 시작하는 코드를 통째로 붙여 넣어 주세요.';
  if (checksum(m[1]) !== m[2]) throw '코드가 중간에 바뀌었거나 일부가 빠졌어요. 다시 복사해 주세요.';
  const nums = [];
  for (const t of m[1].split('.')) {
    if (t[0] === '_') for (let i = parseInt(t.slice(1), 36); i > 0; i--) nums.push(0);
    else nums.push(parseInt(t, 36));
  }
  const expect = 9 + PART_KEYS.length * 2 + RELIC_KEYS.length + STAFF.length * 2;
  if (nums.length !== expect || nums.some(n => !Number.isFinite(n))) throw '이 코드는 읽을 수 없어요.';
  let i = 0; const next = () => nums[i++];
  const s = fresh();
  s.coins = next(); s.gems = next(); s.level = Math.max(1, next()); s.xp = next();
  s.vault = Math.min(VAULTS.length - 1, next()); s.booth = next(); s.last = next() * 1000;
  const owned = next(), claimed = next();
  ORDER.forEach((k, b) => { if (owned & (1 << b)) s.owned[k] = true; });
  MILESTONES.forEach((_, b) => { if (claimed & (1 << b)) s.claimed.push(b); });
  PART_KEYS.forEach(([k, p]) => { const n = next(); if (n) s.inv[k + '.' + p] = n; });
  PART_KEYS.forEach(([k, p]) => { const n = next(); if (n) (s.placed[k] = s.placed[k] || {})[p] = n; });
  RELIC_KEYS.forEach(id => { const n = next(); if (n) s.relics[id] = n; });
  s.staff = STAFF.map(() => {
    const t = next(), end = next() * 1000;
    if (!t || !TRIP_KEYS[t - 1]) return null;
    const trip = TRIP_KEYS[t - 1];
    return { trip, end, start: end - TRIPS[trip].hours * 3600000 };
  });
  s.coins = Math.min(s.coins, VAULTS[s.vault].cap);
  return s;
}
function openSettings() {
  $('codeOut').value = makeCode();
  $('codeIn').value = ''; $('codeMsg').textContent = ''; $('codeMsg').className = 'muted';
  delete $('loadCode').dataset.armed; $('loadCode').textContent = '불러오기';
  $('settings').hidden = false;
}
$('copyCode').onclick = () => {
  const ta = $('codeOut'); ta.value = makeCode();
  const fallback = () => { ta.focus(); ta.select(); toast('코드를 길게 눌러 복사해 주세요.'); };
  try {
    navigator.clipboard.writeText(ta.value).then(() => toast('저장 코드를 복사했어요! 메모장 같은 곳에 보관하세요.'), fallback);
  } catch { fallback(); }
};
$('loadCode').onclick = () => {
  const b = $('loadCode'), msg = $('codeMsg');
  let s;
  try { s = readCode($('codeIn').value); }
  catch (e) { msg.textContent = typeof e === 'string' ? e : '이 코드는 읽을 수 없어요.'; msg.className = 'muted err'; return; }
  if (!b.dataset.armed) {
    b.dataset.armed = 1; b.textContent = '지금 진행 상황을 덮어써요. 한 번 더 누르세요';
    msg.className = 'muted';
    msg.textContent = `코드 확인 완료: Lv ${s.level} · 공룡 ${Object.keys(s.owned).length}마리 · 💎 ${s.gems} · 🪙 ${fmt(s.coins)}`;
    return;
  }
  S = s;
  const away = Math.min(8 * 3600, Math.max(0, (Date.now() - S.last) / 1000));
  S.booth = Math.min(boothCap(), S.booth + away * rate());
  buildWorld(); $('settings').hidden = true; renderAll(); goTo(ENTRANCE, false); save();
  toast(`진행 상황을 불러왔어요! Lv ${S.level}`);
};

$('gearBtn').onclick = openSettings;
$('closeSettings').onclick = () => { $('settings').hidden = true; };
$('resetBtn').onclick = () => {
  const b = $('resetBtn');
  if (!b.dataset.armed) {
    b.dataset.armed = 1; b.textContent = '모든 공룡이 사라져요. 한 번 더 누르세요';
    setTimeout(() => { delete b.dataset.armed; b.textContent = '처음부터 다시 하기'; }, 3000);
    return;
  }
  try { localStorage.removeItem(SAVE_KEY); } catch {}
  S = fresh(); buildWorld();
  $('settings').hidden = true; renderAll(); goTo(ENTRANCE, false); save();
  delete b.dataset.armed; b.textContent = '처음부터 다시 하기';
};

setInterval(() => {
  S.booth = Math.min(boothCap(), S.booth + rate());
  renderBooth(); tickExpedition();
}, 1000);
setInterval(spawnVisitor, 1600);
for (let i = 0; i < 4; i++) setTimeout(spawnVisitor, i * 500);
setInterval(wander, 2600);
setInterval(save, 3000);
document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });
window.addEventListener('pagehide', save);
</script>
