<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>공룡 파크</title>
<style>
  :root {
    --bg: #fdf6e3;
    --panel: #ffffff;
    --ink: #3b2f22;
    --muted: #8a7a66;
    --accent: #e8833a;
    --accent-ink: #ffffff;
    --good: #4caf50;
    --warn: #f2b134;
    --bad: #e05545;
    --line: #eadfca;
    --grass1: #9fd36b;
    --grass2: #7cbf4f;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1f1b16; --panel: #2b251e; --ink: #f3ead9; --muted: #b3a48d;
      --line: #43392d; --grass1: #4f7a34; --grass2: #3d6327;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    -webkit-user-select: none; user-select: none;
  }
  header {
    display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center;
    padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--panel);
  }
  header h1 { font-size: 20px; margin: 0 auto 0 0; }
  .stat { font-weight: 700; font-size: 15px; white-space: nowrap; }
  .stat small { color: var(--muted); font-weight: 500; }
  main {
    display: grid; grid-template-columns: 1fr 300px; gap: 16px; padding: 16px;
    max-width: 1200px; margin: 0 auto;
  }
  @media (max-width: 820px) { main { grid-template-columns: 1fr; } }

  #park {
    position: relative; height: 520px; border-radius: 18px; overflow: hidden;
    background:
      radial-gradient(circle at 20% 30%, rgba(255,255,255,.12) 0 60px, transparent 61px),
      radial-gradient(circle at 75% 70%, rgba(255,255,255,.10) 0 80px, transparent 81px),
      linear-gradient(180deg, var(--grass1), var(--grass2));
    border: 6px solid #8b5e34; box-shadow: inset 0 0 0 3px #b07a45;
  }
  @media (max-width: 820px) { #park { height: 420px; } }
  .deco { position: absolute; font-size: 34px; pointer-events: none; opacity: .9; }
  .pond {
    position: absolute; left: 58%; top: 8%; width: 130px; height: 70px; border-radius: 50%;
    background: radial-gradient(ellipse at 40% 40%, #8fd3ff, #3a9ad9); opacity: .85;
  }

  .dino {
    position: absolute; transform: translate(-50%, -100%); cursor: pointer;
    transition: left 1.6s ease-in-out, top 1.6s ease-in-out;
    text-align: center; line-height: 1;
  }
  .dino .body { display: inline-block; transition: transform .3s; }
  .dino .body.flip { transform: scaleX(-1); }
  .dino .name {
    font-size: 11px; font-weight: 700; background: rgba(255,255,255,.85); color: #3b2f22;
    padding: 1px 6px; border-radius: 8px; margin-top: 2px; white-space: nowrap;
  }
  .dino .mood { position: absolute; top: -14px; right: -10px; font-size: 16px; }
  .dino.selected .name { background: var(--accent); color: #fff; }
  .dino.bounce .body { animation: bounce .5s; }
  @keyframes bounce { 0%,100% { translate: 0 0; } 40% { translate: 0 -18px; } }
  .egg .body { animation: wobble 1.2s infinite; }
  @keyframes wobble { 0%,100% { rotate: 0deg; } 25% { rotate: -10deg; } 75% { rotate: 10deg; } }
  .eggbar { width: 44px; height: 5px; background: rgba(0,0,0,.2); border-radius: 3px; margin: 3px auto 0; overflow: hidden; }
  .eggbar i { display: block; height: 100%; background: #fff; }

  .float {
    position: absolute; pointer-events: none; font-weight: 800; font-size: 14px; color: #fff8c4;
    text-shadow: 0 1px 2px rgba(0,0,0,.6); animation: up 1.2s forwards; transform: translate(-50%, -100%);
  }
  @keyframes up { to { translate: 0 -40px; opacity: 0; } }

  aside { display: flex; flex-direction: column; gap: 16px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
  .card h2 { font-size: 15px; margin: 0 0 10px; }
  .shop-item {
    display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 10px;
    border: 1px solid var(--line); margin-bottom: 8px;
  }
  .shop-item .ico { font-size: 28px; width: 36px; text-align: center; }
  .shop-item .info { flex: 1; font-size: 13px; }
  .shop-item .info b { display: block; font-size: 14px; }
  .shop-item .info span { color: var(--muted); }
  button {
    font: inherit; font-weight: 700; font-size: 13px; border: 0; border-radius: 10px;
    padding: 8px 12px; background: var(--accent); color: var(--accent-ink); cursor: pointer;
  }
  button:disabled { opacity: .4; cursor: not-allowed; }
  button.ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .row button { flex: 1; }
  .bar { height: 10px; background: var(--line); border-radius: 6px; overflow: hidden; margin: 4px 0 10px; }
  .bar i { display: block; height: 100%; transition: width .4s; }
  .label { display: flex; justify-content: space-between; font-size: 13px; }
  .empty { color: var(--muted); font-size: 13px; }
  #toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
    background: #3b2f22; color: #fff; padding: 10px 16px; border-radius: 12px; font-size: 14px;
    opacity: 0; transition: opacity .3s; pointer-events: none; max-width: calc(100% - 32px); text-align: center;
  }
  #toast.show { opacity: 1; }
</style>
</head>
<body>
<header>
  <h1>🦕 공룡 파크</h1>
  <div class="stat">🪙 <span id="coins">0</span></div>
  <div class="stat">👨‍👩‍👧 <span id="visitors">0</span> <small>관람객</small></div>
  <div class="stat">🏞️ <span id="count">0</span>/<span id="cap">0</span> <small>수용</small></div>
</header>

<main>
  <div id="park">
    <div class="pond"></div>
    <div class="deco" style="left:4%;top:4%">🌴</div>
    <div class="deco" style="left:88%;top:6%">🌋</div>
    <div class="deco" style="left:3%;top:78%">🌿</div>
    <div class="deco" style="left:90%;top:82%">🌴</div>
    <div class="deco" style="left:40%;top:3%">🌳</div>
    <div class="deco" style="left:30%;top:86%">🪨</div>
  </div>

  <aside>
    <div class="card" id="detail">
      <h2>선택한 공룡</h2>
      <div class="empty">공원에서 공룡을 눌러보세요.</div>
    </div>
    <div class="card">
      <h2>🥚 알 상점</h2>
      <div id="shop"></div>
    </div>
    <div class="card">
      <h2>🔧 공원 관리</h2>
      <div class="row">
        <button id="expand"></button>
      </div>
      <div class="row" style="margin-top:8px">
        <button class="ghost" id="reset">처음부터 다시</button>
      </div>
    </div>
  </aside>
</main>
<div id="toast"></div>

<script>
const SPECIES = {
  bronto: { name: '브라키오사우루스', emoji: '🦕', diet: 'plant', price: 50,  hatch: 10, income: 1,   size: 46, filter: '' },
  stego:  { name: '스테고사우루스',   emoji: '🦕', diet: 'plant', price: 90,  hatch: 15, income: 2,   size: 40, filter: 'hue-rotate(160deg) saturate(1.4)' },
  raptor: { name: '벨로시랩터',       emoji: '🦖', diet: 'meat',  price: 150, hatch: 20, income: 3,   size: 34, filter: 'hue-rotate(250deg)' },
  rex:    { name: '티라노사우루스',   emoji: '🦖', diet: 'meat',  price: 300, hatch: 30, income: 6,   size: 56, filter: '' },
  gold:   { name: '황금 공룡',        emoji: '🦕', diet: 'plant', price: 1000,hatch: 45, income: 15,  size: 50, filter: 'sepia(1) saturate(4) brightness(1.15)' },
};
const FOOD = { plant: { emoji: '🌿', name: '풀', price: 5 }, meat: { emoji: '🍖', name: '고기', price: 10 } };
const NAMES = ['뽀삐','두부','콩이','초코','망고','쿵쿵이','보리','감자','호떡','루루','몽이','짱구','도토리','깜지','하루','라떼','모찌','꼬북','누룽지','단추'];
const SAVE_KEY = 'dino-park-save-v1';

let state = load() || { coins: 150, cap: 4, nextId: 1, dinos: [] };
let selectedId = null;

const $ = id => document.getElementById(id);
const park = $('park');
const els = {}; // id -> element

function load() { try { return JSON.parse(localStorage.getItem(SAVE_KEY)); } catch { return null; } }
function save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(state)); } catch {} }

function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 1800);
}
function floatText(d, text) {
  const f = document.createElement('div');
  f.className = 'float'; f.textContent = text;
  f.style.left = d.x + '%'; f.style.top = (d.y - 8) + '%';
  park.appendChild(f); setTimeout(() => f.remove(), 1200);
}
const rand = (a, b) => a + Math.random() * (b - a);

function pickName() {
  const used = new Set(state.dinos.map(d => d.name));
  const free = NAMES.filter(n => !used.has(n));
  const pool = free.length ? free : NAMES;
  return pool[Math.floor(Math.random() * pool.length)];
}
function buyEgg(key) {
  const sp = SPECIES[key];
  if (state.dinos.length >= state.cap) return toast('공원이 꽉 찼어요! 울타리를 넓혀주세요.');
  if (state.coins < sp.price) return toast('코인이 부족해요.');
  state.coins -= sp.price;
  const d = {
    id: state.nextId++, species: key, name: pickName(),
    egg: sp.hatch, hunger: 80, happy: 80, growth: 0,
    x: rand(10, 90), y: rand(25, 92), flip: false,
  };
  state.dinos.push(d);
  selectedId = d.id;
  toast(`${sp.name} 알을 샀어요! 곧 부화해요.`);
  render();
}

function feed(d) {
  const sp = SPECIES[d.species], food = FOOD[sp.diet];
  if (state.coins < food.price) return toast('코인이 부족해요.');
  if (d.hunger >= 100) return toast(`${d.name}는 배불러요!`);
  state.coins -= food.price;
  d.hunger = Math.min(100, d.hunger + 35);
  d.happy = Math.min(100, d.happy + 5);
  d.growth = Math.min(100, d.growth + 8);
  floatText(d, food.emoji + ' 냠냠');
  bounce(d); render();
}
function play(d) {
  if (d.hunger < 15) return toast(`${d.name}는 너무 배고파서 놀 힘이 없어요.`);
  d.happy = Math.min(100, d.happy + 20);
  d.hunger = Math.max(0, d.hunger - 5);
  d.growth = Math.min(100, d.growth + 4);
  floatText(d, '💕');
  bounce(d); render();
}
function sell(d) {
  const sp = SPECIES[d.species];
  const price = Math.round(sp.price * (d.growth >= 100 ? 1.5 : 0.5));
  if (!confirm(`${d.name}(${sp.name})를 다른 공원에 ${price}코인에 보낼까요?`)) return;
  state.coins += price;
  state.dinos = state.dinos.filter(x => x.id !== d.id);
  els[d.id]?.remove(); delete els[d.id];
  selectedId = null; render();
}
function bounce(d) {
  const el = els[d.id]; if (!el) return;
  el.classList.remove('bounce'); void el.offsetWidth; el.classList.add('bounce');
}
function expandCost() { return 100 * Math.pow(2, state.cap - 4); }

function moodOf(d) {
  if (d.hunger < 20) return '🍽️';
  if (d.happy < 30) return '😢';
  if (d.happy > 80) return '😊';
  return '';
}

function renderPark() {
  for (const d of state.dinos) {
    let el = els[d.id];
    const sp = SPECIES[d.species];
    if (!el) {
      el = document.createElement('div');
      el.className = 'dino';
      el.innerHTML = '<div class="mood"></div><div class="body"></div><div class="name"></div><div class="eggbar"><i></i></div>';
      el.addEventListener('click', e => { e.stopPropagation(); selectedId = d.id; render(); });
      park.appendChild(el); els[d.id] = el;
    }
    const isEgg = d.egg > 0;
    const body = el.querySelector('.body');
    el.classList.toggle('egg', isEgg);
    el.classList.toggle('selected', d.id === selectedId);
    el.style.left = d.x + '%'; el.style.top = d.y + '%';
    el.style.zIndex = Math.round(d.y);
    const scale = 0.55 + 0.45 * (d.growth / 100);
    body.textContent = isEgg ? '🥚' : sp.emoji;
    body.style.fontSize = (isEgg ? 30 : sp.size * scale) + 'px';
    body.style.filter = isEgg ? '' : sp.filter;
    body.classList.toggle('flip', !isEgg && d.flip);
    el.querySelector('.name').textContent = d.name;
    el.querySelector('.mood').textContent = isEgg ? '' : moodOf(d);
    const bar = el.querySelector('.eggbar');
    bar.style.display = isEgg ? 'block' : 'none';
    if (isEgg) bar.firstChild.style.width = (100 * (1 - d.egg / sp.hatch)) + '%';
  }
}

function bar(label, val, color) {
  return `<div class="label"><span>${label}</span><span>${Math.round(val)}</span></div>
          <div class="bar"><i style="width:${val}%;background:${color}"></i></div>`;
}
const colorFor = v => v > 60 ? 'var(--good)' : v > 25 ? 'var(--warn)' : 'var(--bad)';

function renderDetail() {
  const box = $('detail');
  const d = state.dinos.find(x => x.id === selectedId);
  if (!d) { box.innerHTML = '<h2>선택한 공룡</h2><div class="empty">공원에서 공룡을 눌러보세요.</div>'; return; }
  const sp = SPECIES[d.species];
  if (d.egg > 0) {
    box.innerHTML = `<h2>🥚 ${d.name}의 알</h2>
      <div class="empty">${sp.name} 알이에요. ${Math.ceil(d.egg)}초 뒤에 부화해요!</div>`;
    return;
  }
  const food = FOOD[sp.diet];
  const stage = d.growth >= 100 ? '어른' : d.growth >= 50 ? '청소년' : '아기';
  box.innerHTML = `<h2>${sp.emoji} ${d.name} <small style="color:var(--muted);font-weight:500">${sp.name} · ${stage}</small></h2>
    ${bar('🍖 배부름', d.hunger, colorFor(d.hunger))}
    ${bar('💖 행복', d.happy, colorFor(d.happy))}
    ${bar('🌱 성장', d.growth, 'var(--accent)')}
    <div class="row">
      <button id="bFeed">${food.emoji} ${food.name} 주기 (${food.price})</button>
      <button id="bPlay">🎾 놀아주기</button>
    </div>
    <div class="row" style="margin-top:8px"><button class="ghost" id="bSell">다른 공원에 보내기</button></div>`;
  $('bFeed').onclick = () => feed(d);
  $('bPlay').onclick = () => play(d);
  $('bSell').onclick = () => sell(d);
}

function renderShop() {
  const shop = $('shop');
  if (!shop.dataset.built) {
    shop.innerHTML = Object.entries(SPECIES).map(([k, sp]) => `
      <div class="shop-item">
        <div class="ico" style="filter:${sp.filter}">${sp.emoji}</div>
        <div class="info"><b>${sp.name}</b><span>${sp.diet === 'meat' ? '육식 🍖' : '초식 🌿'} · 수입 ${sp.income}/초</span></div>
        <button data-k="${k}">🪙 ${sp.price}</button>
      </div>`).join('');
    shop.querySelectorAll('button').forEach(b => b.onclick = () => buyEgg(b.dataset.k));
    shop.dataset.built = 1;
  }
  shop.querySelectorAll('button').forEach(b => {
    b.disabled = state.coins < SPECIES[b.dataset.k].price || state.dinos.length >= state.cap;
  });
}

function visitors() {
  return state.dinos.filter(d => d.egg <= 0).reduce((s, d) => s + Math.round(d.happy / 10 * (d.growth >= 100 ? 2 : 1)), 0);
}

function render() {
  $('coins').textContent = Math.floor(state.coins).toLocaleString();
  $('count').textContent = state.dinos.length;
  $('cap').textContent = state.cap;
  $('visitors').textContent = visitors();
  const cost = expandCost();
  $('expand').textContent = `🪵 울타리 넓히기 (+2칸) · 🪙 ${cost}`;
  $('expand').disabled = state.coins < cost;
  renderPark(); renderDetail(); renderShop();
}

// 1초마다 게임 진행
function tick() {
  let earned = 0;
  for (const d of state.dinos) {
    const sp = SPECIES[d.species];
    if (d.egg > 0) {
      d.egg -= 1;
      if (d.egg <= 0) { d.egg = 0; toast(`🎉 ${d.name}(${sp.name})가 태어났어요!`); floatText(d, '🎉'); }
      continue;
    }
    d.hunger = Math.max(0, d.hunger - 0.6);
    d.happy = Math.max(0, d.happy - (d.hunger < 20 ? 1.5 : 0.3));
    if (d.hunger > 50 && d.happy > 50) d.growth = Math.min(100, d.growth + 0.15);
    if (d.hunger > 0) {
      const mult = d.growth >= 100 ? 2 : 1;
      earned += sp.income * (d.happy / 100) * mult;
    }
  }
  state.coins += earned;
  render();
}

// 공룡 돌아다니기
function wander() {
  for (const d of state.dinos) {
    if (d.egg > 0 || Math.random() < 0.4) continue;
    const nx = Math.min(92, Math.max(8, d.x + rand(-18, 18)));
    d.flip = nx > d.x;
    d.x = nx;
    d.y = Math.min(94, Math.max(22, d.y + rand(-14, 14)));
  }
  renderPark();
}

// 관람객이 가끔 팁을 줌
function tips() {
  const happy = state.dinos.filter(d => d.egg <= 0 && d.happy > 60);
  if (!happy.length) return;
  const d = happy[Math.floor(Math.random() * happy.length)];
  const amt = Math.round(SPECIES[d.species].income * 5);
  state.coins += amt;
  floatText(d, `+${amt} 🪙`);
}

$('expand').onclick = () => {
  const cost = expandCost();
  if (state.coins < cost) return;
  state.coins -= cost; state.cap += 2;
  toast('울타리를 넓혔어요! 공룡을 더 키울 수 있어요.');
  render();
};
$('reset').onclick = () => {
  if (!confirm('정말 처음부터 다시 시작할까요? 모든 공룡이 사라져요.')) return;
  Object.values(els).forEach(e => e.remove());
  for (const k in els) delete els[k];
  state = { coins: 150, cap: 4, nextId: 1, dinos: [] };
  selectedId = null; save(); render();
};
park.addEventListener('click', () => { selectedId = null; render(); });

render();
if (!state.dinos.length) toast('알을 사서 첫 공룡을 키워보세요! 🥚');
setInterval(tick, 1000);
setInterval(wander, 2500);
setInterval(tips, 4000);
setInterval(save, 3000);
window.addEventListener('beforeunload', save);
</script>
</body>
</html>
